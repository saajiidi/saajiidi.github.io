<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Project showcase by Sajid Islam - Full-stack developer & data scientist.">
  <meta name="author" content="Sajid Islam">
  <title>Projects — Sajid Islam</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital,wght@0,400;1,400&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            serif: ['"Instrument Serif"', 'serif'],
            hand: ['Caveat', 'cursive'],
          }
        }
      }
    }
  </script>

  <!-- Theme Engine -->
  <link href="css/color-palette.css" rel="stylesheet">
  <link href="css/shared-components.css" rel="stylesheet">
  <link href="themes/sketchbook/sketchbook-entry.css" rel="stylesheet">
  <link href="css/projects.css" rel="stylesheet">
</head>
<body>

<div class="back-to-home">
  <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
</div>

<main class="container">
  <h1 class="section-title">Project Showcase</h1>

  <p class="intro-text">
    A selection of my featured projects spanning full-stack development, data science, and automation.
  </p>

  <!-- Filter Controls -->
  <div class="filter-bar">
    <input type="search" id="project-search" placeholder="Search projects..." aria-label="Search projects" class="search-input" />
    <div class="filter-buttons" role="group" aria-label="Filter projects by category">
      <button class="filter-btn active" data-filter="all">All Projects</button>
      <button class="filter-btn" data-filter="fullstack">Full-Stack</button>
      <button class="filter-btn" data-filter="frontend">Frontend</button>
      <button class="filter-btn" data-filter="datascience">Data Science</button>
      <button class="filter-btn" data-filter="automation">Automation</button>
      <button class="filter-btn" data-filter="telegram">Telegram Bots</button>
    </div>
  </div>

  <!-- Projects Grid -->
  <div id="projects-grid" class="grid">
    <!-- Project cards will be dynamically loaded here -->
  </div>

  <div class="view-more">
    <small>Want to see more projects? Visit my <a href="https://github.com/Sajid-ul-Islam" target="_blank" rel="noopener noreferrer">GitHub profile</a>.</small>
  </div>
</main>

<script>
// Project Showcase Script
document.addEventListener('DOMContentLoaded', async () => {
  const grid = document.getElementById('projects-grid');
  const searchInput = document.getElementById('project-search');
  const filterButtons = document.querySelectorAll('.filter-btn');
  
  let projects = [];
  let activeFilter = 'all';
  let searchTerm = '';

  // Fetch project data
  try {
    const response = await fetch('assets/data/projects.json?v=' + Date.now());
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    projects = await response.json();
  } catch (error) {
    console.error('Failed to load projects:', error);
    if (grid) {
      grid.innerHTML = '<div class="col-span-full p-6 text-center text-muted">Unable to load projects list. Please visit <a href="https://github.com/Sajid-ul-Islam" class="underline" target="_blank" rel="noopener noreferrer">GitHub</a>.</div>';
    }
    return;
  }

  // Render projects
  function renderProjects() {
    if (!grid) return;
    const filtered = projects.filter(project => {
      const matchesFilter = activeFilter === 'all' || (project.tags && project.tags.includes(activeFilter));
      const search = searchTerm.toLowerCase();
      const matchesSearch = 
        (project.title && project.title.toLowerCase().includes(search)) ||
        (project.description && project.description.toLowerCase().includes(search)) ||
        (project.technologies && project.technologies.some(tech => tech.toLowerCase().includes(search)));
      
      return matchesFilter && matchesSearch;
    });

    if (filtered.length === 0) {
      grid.innerHTML = '<div class="col-span-full p-6 text-center text-muted">No projects found matching current criteria.</div>';
      return;
    }

    grid.innerHTML = filtered.map(project => `
      <article class="project-card" data-tags="${(project.tags || []).join(' ')}">
        <h3 class="project-title">${project.title || ''}</h3>
        <p class="project-description">${project.description || ''}</p>
        
        <div class="tech-badges">
          ${(project.technologies || []).map(tech => `<span class="tech-badge">${tech}</span>`).join('')}
        </div>
        
        <div class="project-links">
          ${(project.links || []).map(link => `<a href="${link.url}" target="_blank" rel="noopener noreferrer">${link.label}</a>`).join('')}
        </div>
      </article>
    `).join('');
  }

  // Event listeners
  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter || 'all';
      renderProjects();
    });
  });

  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      searchTerm = e.target.value;
      renderProjects();
    });
  }

  // Initial render
  renderProjects();
});
</script>

<script type="module">
  import { initAccentSwitcher } from './js/theme-accent.js';
  try {
    initAccentSwitcher();
  } catch (err) {
    console.warn('Accent switcher init:', err);
  }
</script>
</body>
</html>
