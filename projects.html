<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Project showcase by Sajid Islam - Full-stack developer & data scientist.">
  <meta name="author" content="Sajid Islam">
  <title>Projects — Sajid Islam</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital,wght@0,400;1,400&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            serif: ['"Instrument Serif"', 'serif'],
            hand: ['Caveat', 'cursive'],
          }
        }
      }
    }
  </script>

  <!-- Theme Engine -->
  <link href="css/color-palette.css" rel="stylesheet">
  <link href="css/shared-components.css" rel="stylesheet">
  <link href="themes/sketchbook/sketchbook-entry.css" rel="stylesheet">
  <link href="css/projects.css" rel="stylesheet">
</head>
<body>

<div class="back-to-home">
  <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
</div>

<main class="container">
  <h1 class="section-title">Project Showcase</h1>

  <p class="intro-text">
    A selection of my featured projects spanning full-stack development, data science, and automation.
  </p>

  <!-- Filter Controls -->
  <div class="filter-bar">
    <input type="search" id="project-search" placeholder="Search projects..." class="search-input" />
    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all">All Projects</button>
      <button class="filter-btn" data-filter="fullstack">Full-Stack</button>
      <button class="filter-btn" data-filter="frontend">Frontend</button>
      <button class="filter-btn" data-filter="datascience">Data Science</button>
      <button class="filter-btn" data-filter="automation">Automation</button>
      <button class="filter-btn" data-filter="telegram">Telegram Bots</button>
    </div>
  </div>

  <!-- Projects Grid -->
  <div id="projects-grid" class="grid">
    <!-- Project cards will be dynamically loaded here -->
  </div>

  <div class="view-more">
    <small>Want to see more projects? Visit my <a href="https://github.com/Sajid-ul-Islam">GitHub profile</a>.</small>
  </div>
</main>

<script>
// Project Showcase Script
document.addEventListener('DOMContentLoaded', async () => {
  const grid = document.getElementById('projects-grid');
  const searchInput = document.getElementById('project-search');
  const filterButtons = document.querySelectorAll('.filter-btn');
  
  let projects = [];
  let activeFilter = 'all';
  let searchTerm = '';

  // Fetch project data
  try {
    const response = await fetch('assets/data/projects.json');
    projects = await response.json();
  } catch (error) {
    console.error('Failed to load projects:', error);
  }

  // Render projects
  function renderProjects() {
    const filtered = projects.filter(project => {
      const matchesFilter = activeFilter === 'all' || project.tags.includes(activeFilter);
      const matchesSearch = 
        project.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
        project.description.toLowerCase().includes(searchTerm.toLowerCase()) ||
        project.technologies.some(tech => tech.toLowerCase().includes(searchTerm.toLowerCase()));
      
      return matchesFilter && matchesSearch;
    });

    grid.innerHTML = filtered.map(project => `
      <article class="project-card" data-tags="${project.tags.join(' ')}">
        <h3 class="project-title">${project.title}</h3>
        <p class="project-description">${project.description}</p>
        
        <div class="tech-badges">
          ${project.technologies.map(tech => `<span class="tech-badge">${tech}</span>`).join('')}
        </div>
        
        <div class="project-links">
          ${project.links.map(link => `<a href="${link.url}" target="_blank">${link.label}</a>`).join('')}
        </div>
      </article>
    `).join('');
  }

  // Event listeners
  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      renderProjects();
    });
  });

  searchInput.addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderProjects();
  });

  // Initial render
  renderProjects();
});
</script>

<script src="js/theme-accent.js"></script>
</body>
</html>
